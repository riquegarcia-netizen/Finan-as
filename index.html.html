<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --paper-outer:#c9c3af;
  --paper:#eee9dc;
  --card:#fbfaf4;
  --ink:#242b1e;
  --ink-soft:#6d715c;
  --line:#cdc4a7;
  --line-strong:#a49c80;
  --green:#2f6b4f;
  --green-soft:#e0ebe1;
  --red:#a23b2c;
  --red-soft:#f6ded8;
  --gold:#a97a2b;
  --gold-soft:#f1e5c9;
  --shadow: 0 24px 50px rgba(30,32,20,0.28);
  --font-display:'Fraunces', serif;
  --font-mono:'Space Mono', monospace;
  --font-body:'Inter', system-ui, -apple-system, sans-serif;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-body);
  background:var(--paper-outer);
  color:var(--ink);
  min-height:100vh;
  display:flex;
  justify-content:center;
  padding:24px 12px;
}

.phone{
  width:100%;
  max-width:430px;
  background:var(--paper);
  border-radius:30px;
  box-shadow:var(--shadow);
  overflow:hidden;
  border:1px solid rgba(0,0,0,0.06);
}

.notch{
  height:22px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.notch::before{
  content:'';
  width:70px;
  height:6px;
  border-radius:4px;
  background:rgba(0,0,0,0.15);
}

header{
  padding:6px 24px 18px;
  text-align:center;
}
header .eyebrow{
  font-family:var(--font-mono);
  font-size:11px;
  letter-spacing:2px;
  text-transform:uppercase;
  color:var(--ink-soft);
}
header h1{
  font-family:var(--font-display);
  font-weight:600;
  font-size:26px;
  margin:4px 0 10px;
}
.mes-row{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
}
.mes-input{
  font-family:var(--font-display);
  font-weight:600;
  font-size:15px;
  text-align:center;
  border:none;
  background:transparent;
  color:var(--ink);
  border-bottom:1px dashed var(--line-strong);
  padding:2px 4px;
  width:150px;
}
.mes-input:focus{outline:none; border-bottom-color:var(--ink);}

.saldo-card{
  margin:0 20px 16px;
  background:var(--card);
  border-radius:20px;
  padding:20px;
  text-align:center;
  box-shadow:0 8px 18px rgba(0,0,0,0.06);
}
.saldo-label{
  font-size:12px;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:var(--ink-soft);
  font-weight:600;
}
.saldo-valor{
  font-family:var(--font-mono);
  font-weight:700;
  font-size:34px;
  margin:6px 0 10px;
}
.saldo-valor.pos{color:var(--green);}
.saldo-valor.neg{color:var(--red);}
.chips{
  display:flex;
  gap:8px;
  justify-content:center;
  flex-wrap:wrap;
}
.chip{
  font-family:var(--font-mono);
  font-size:12px;
  padding:5px 10px;
  border-radius:100px;
  background:var(--paper);
  color:var(--ink-soft);
}
.chip b{color:var(--ink); font-weight:700;}

.section{
  margin:0 20px 18px;
}
.section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:8px;
  padding:0 2px;
}
.section-head h2{
  font-family:var(--font-display);
  font-size:15px;
  font-weight:600;
  margin:0;
  letter-spacing:0.3px;
}
.section-total{
  font-family:var(--font-mono);
  font-size:13px;
  color:var(--ink-soft);
}
.add-btn{
  border:none;
  background:var(--ink);
  color:var(--paper);
  width:26px;
  height:26px;
  border-radius:50%;
  font-size:16px;
  line-height:1;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
}
.add-btn:active{transform:scale(0.92);}

.salario-card{
  background:var(--card);
  border-radius:16px;
  padding:12px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
.salario-card label{
  font-size:13px;
  font-weight:600;
  color:var(--ink-soft);
}
.salario-card .valor-input{
  text-align:right;
  font-size:17px;
}

.list{
  background:var(--card);
  border-radius:16px;
  overflow:hidden;
}
.item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:11px 14px;
  border-bottom:1px solid var(--line);
}
.item:last-child{border-bottom:none;}
.item.paid .nome-input,
.item.paid .valor-input{
  color:var(--ink-soft);
  text-decoration:line-through;
  text-decoration-color:var(--line-strong);
}

.check{
  flex:0 0 auto;
  width:22px;
  height:22px;
  border-radius:50%;
  border:2px solid var(--line-strong);
  background:transparent;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0;
  color:transparent;
  font-size:12px;
  transition:all .15s ease;
}
.check.on{
  background:var(--green);
  border-color:var(--green);
  color:#fff;
}

.nome-input{
  flex:1 1 auto;
  min-width:0;
  border:none;
  background:transparent;
  font-family:var(--font-body);
  font-size:14.5px;
  font-weight:500;
  color:var(--ink);
  padding:4px 2px;
}
.nome-input:focus{outline:none;}
.nome-input::placeholder{color:#a9a58f;}

.valor-wrap{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  font-family:var(--font-mono);
  font-size:14px;
}
.valor-wrap span{color:var(--ink-soft); margin-right:2px;}
.valor-input{
  width:78px;
  border:none;
  background:transparent;
  font-family:var(--font-mono);
  font-size:14px;
  color:var(--ink);
  text-align:right;
  padding:4px 2px;
}
.valor-input:focus{outline:none;}

.del-btn{
  flex:0 0 auto;
  border:none;
  background:transparent;
  color:#b7ae91;
  font-size:16px;
  cursor:pointer;
  padding:2px 4px;
  line-height:1;
}
.del-btn:hover{color:var(--red);}

.empty{
  padding:22px 14px;
  text-align:center;
  color:var(--ink-soft);
  font-size:13px;
  line-height:1.5;
}

.receipt{
  margin:22px 20px 0;
  background:var(--card);
  border-radius:2px;
  padding:22px 20px 24px;
  position:relative;
  box-shadow:0 10px 24px rgba(0,0,0,0.10);
  transform:rotate(-0.4deg);
}
.receipt::before, .receipt::after{
  content:'';
  position:absolute;
  left:0; right:0;
  height:10px;
  background:
    radial-gradient(circle at 8px 0, transparent 6px, var(--card) 6.5px) repeat-x;
  background-size:16px 20px;
}
.receipt::before{top:-9px;}
.receipt::after{bottom:-9px; transform:rotate(180deg);}
.receipt-title{
  font-family:var(--font-mono);
  font-size:12px;
  text-align:center;
  letter-spacing:3px;
  text-transform:uppercase;
  color:var(--ink-soft);
  margin-bottom:14px;
}
.rline{
  display:flex;
  align-items:baseline;
  gap:6px;
  font-family:var(--font-mono);
  font-size:12.5px;
  margin-bottom:7px;
  color:var(--ink);
}
.rline .lbl{white-space:nowrap;}
.rline .dots{
  flex:1;
  border-bottom:1px dotted var(--line-strong);
  transform:translateY(-3px);
}
.rline .val{white-space:nowrap; font-weight:700;}
.rline.sub .val{font-weight:400; color:var(--ink-soft);}
.rline.neg .val{color:var(--red);}
.rdiv{
  border-top:1px dashed var(--line-strong);
  margin:12px 0;
}
.rline.total{font-size:15px; margin-top:2px;}
.rline.total .val.pos{color:var(--green);}
.rline.total .val.neg{color:var(--red);}
.rline.total .lbl{font-weight:700;}

.stamp-row{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-top:16px;
}
.stamp{
  font-family:var(--font-mono);
  font-size:10.5px;
  letter-spacing:1px;
  border:2px solid;
  border-radius:4px;
  padding:4px 8px;
  transform:rotate(-3deg);
  text-transform:uppercase;
}
.stamp.pago{color:var(--green); border-color:var(--green);}
.stamp.falta{color:var(--red); border-color:var(--red); transform:rotate(2deg);}

.footer-actions{
  margin:20px 20px 24px;
  text-align:center;
}
.close-month-btn{
  border:none;
  background:transparent;
  color:var(--ink-soft);
  font-family:var(--font-body);
  font-size:12.5px;
  text-decoration:underline;
  text-underline-offset:3px;
  cursor:pointer;
  padding:8px;
}
.confirm-box{
  margin:0 20px 20px;
  background:var(--gold-soft);
  border:1px solid var(--gold);
  border-radius:14px;
  padding:14px 16px;
  font-size:13px;
  line-height:1.5;
  color:#5c4310;
  display:none;
}
.confirm-box.show{display:block;}
.confirm-actions{
  display:flex;
  gap:10px;
  margin-top:10px;
}
.confirm-actions button{
  flex:1;
  padding:8px;
  border-radius:100px;
  border:none;
  font-size:12.5px;
  font-weight:600;
  cursor:pointer;
  font-family:var(--font-body);
}
.btn-confirm{background:var(--red); color:#fff;}
.btn-cancel{background:transparent; color:var(--ink-soft); border:1px solid var(--line-strong) !important;}

.loading{
  padding:60px 20px;
  text-align:center;
  color:var(--ink-soft);
  font-family:var(--font-mono);
  font-size:13px;
}

.savehint{
  text-align:center;
  font-size:10.5px;
  color:var(--ink-soft);
  opacity:0;
  transition:opacity .3s ease;
  font-family:var(--font-mono);
  margin-top:-6px;
  margin-bottom:10px;
}
.savehint.show{opacity:0.8;}
</style>

<body>

<div class="phone">
  <div class="notch"></div>
  <div id="app">
    <div class="loading">carregando seu recibo…</div>
  </div>
</div>

<script>
(function(){
  const STORAGE_KEYS = { config: 'controle-financeiro:config', fixas: 'controle-financeiro:fixas', extras: 'controle-financeiro:extras' };

  const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

  let state = {
    salario: 0,
    mes: MESES[new Date().getMonth()] + ' ' + new Date().getFullYear(),
    fixas: [],
    extras: []
  };

  const app = document.getElementById('app');

  function uid(){
    return 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  }

  function debounce(fn, wait){
    let t;
    return function(...args){
      clearTimeout(t);
      t = setTimeout(() => fn.apply(null, args), wait);
    };
  }

  function formatBRL(n){
    if (isNaN(n)) n = 0;
    return n.toLocaleString('pt-BR', { style:'currency', currency:'BRL' });
  }

  function parseValor(str){
    if (typeof str !== 'string') return Number(str) || 0;
    const cleaned = str.trim().replace(/[^\d,.-]/g,'').replace(',', '.');
    const n = parseFloat(cleaned);
    return isNaN(n) ? 0 : n;
  }

  // ---------- storage híbrido ----------
  // Detecta automaticamente onde rodar: dentro do Claude (window.storage) ou
  // como arquivo aberto direto no navegador (localStorage). Nunca trava: se a
  // detecção demorar mais que o limite, cai pro localStorage.
  let backend = null; // 'claude' | 'local'

  function withTimeout(promise, ms){
    return new Promise((resolve, reject) => {
      const timer = setTimeout(() => reject(new Error('TIMEOUT')), ms);
      Promise.resolve(promise).then(
        (v) => { clearTimeout(timer); resolve(v); },
        (e) => { clearTimeout(timer); reject(e); }
      );
    });
  }

  async function detectBackend(){
    const temWindowStorage = typeof window.storage === 'object' && window.storage
      && typeof window.storage.get === 'function' && typeof window.storage.set === 'function';

    if (temWindowStorage){
      try{
        await withTimeout(window.storage.get('__cf_probe__'), 700);
        return 'claude'; // respondeu rápido (achou ou não achou a chave) = backend real
      }catch(e){
        if (e && e.message === 'TIMEOUT') return 'local'; // travou = não é um backend funcional
        return 'claude'; // deu erro rápido (ex: chave não existe) = backend real, só sem dado ainda
      }
    }

    let localOk = true;
    try{
      localStorage.setItem('__cf_test__','1');
      localStorage.removeItem('__cf_test__');
    }catch(e){ localOk = false; }
    return localOk ? 'local' : 'none';
  }

  async function storageGet(key){
    if (backend === 'claude'){
      try{
        const r = await withTimeout(window.storage.get(key), 1500);
        return (r && typeof r.value === 'string') ? r.value : null;
      }catch(e){ return null; }
    }
    if (backend === 'local'){
      try{ return localStorage.getItem(key); }catch(e){ return null; }
    }
    return null;
  }

  async function storageSet(key, value){
    if (backend === 'claude'){
      try{ await withTimeout(window.storage.set(key, value), 1500); return true; }
      catch(e){ return false; }
    }
    if (backend === 'local'){
      try{ localStorage.setItem(key, value); return true; }
      catch(e){ return false; }
    }
    return false;
  }

  async function loadState(){
    backend = await detectBackend();

    try{
      const c = await storageGet(STORAGE_KEYS.config);
      if (c){
        const parsed = JSON.parse(c);
        state.salario = parsed.salario || 0;
        state.mes = parsed.mes || state.mes;
      }
    }catch(e){ /* sem config salva ainda, mantém padrão */ }

    try{
      const f = await storageGet(STORAGE_KEYS.fixas);
      if (f) state.fixas = JSON.parse(f);
    }catch(e){ state.fixas = []; }

    try{
      const ex = await storageGet(STORAGE_KEYS.extras);
      if (ex) state.extras = JSON.parse(ex);
    }catch(e){ state.extras = []; }
  }

  function showSaveHint(ok){
    const hint = document.getElementById('savehint');
    if (!hint) return;
    hint.textContent = (ok !== false) ? 'salvo ✓' : 'não foi possível salvar neste navegador';
    hint.classList.add('show');
    clearTimeout(showSaveHint._t);
    showSaveHint._t = setTimeout(() => hint.classList.remove('show'), 1200);
  }

  const saveConfig = debounce(async () => {
    const ok = await storageSet(STORAGE_KEYS.config, JSON.stringify({ salario: state.salario, mes: state.mes }));
    showSaveHint(ok);
  }, 400);

  const saveFixas = debounce(async () => {
    const ok = await storageSet(STORAGE_KEYS.fixas, JSON.stringify(state.fixas));
    showSaveHint(ok);
  }, 400);

  const saveExtras = debounce(async () => {
    const ok = await storageSet(STORAGE_KEYS.extras, JSON.stringify(state.extras));
    showSaveHint(ok);
  }, 400);

  // ---------- calculations ----------
  function totals(){
    const sum = (arr) => arr.reduce((s,i) => s + (Number(i.valor) || 0), 0);
    const sumPago = (arr) => arr.filter(i=>i.pago).reduce((s,i) => s + (Number(i.valor) || 0), 0);
    const totalFixas = sum(state.fixas);
    const totalExtras = sum(state.extras);
    const totalGasto = totalFixas + totalExtras;
    const totalPago = sumPago(state.fixas) + sumPago(state.extras);
    const totalFalta = totalGasto - totalPago;
    const saldoPrevisto = state.salario - totalGasto;
    const disponivelAgora = state.salario - totalPago;
    return { totalFixas, totalExtras, totalGasto, totalPago, totalFalta, saldoPrevisto, disponivelAgora };
  }

  // ---------- render ----------
  function render(){
    const t = totals();

    app.innerHTML = `
      <header>
        <div class="eyebrow">Controle Financeiro</div>
        <h1>Recibo do Mês</h1>
        <div class="mes-row">
          <input class="mes-input" id="mes-input" value="${escapeAttr(state.mes)}" placeholder="ex: Julho 2026" />
        </div>
      </header>

      <div class="saldo-card">
        <div class="saldo-label">Saldo previsto do mês</div>
        <div class="saldo-valor ${t.saldoPrevisto >= 0 ? 'pos':'neg'}">${formatBRL(t.saldoPrevisto)}</div>
        <div class="chips">
          <div class="chip">Gasto total <b>${formatBRL(t.totalGasto)}</b></div>
          <div class="chip">Falta pagar <b>${formatBRL(t.totalFalta)}</b></div>
        </div>
      </div>

      <div class="section">
        <div class="salario-card">
          <label for="salario-input">Salário / renda do mês</label>
          <div class="valor-wrap">
            <span>R$</span>
            <input id="salario-input" class="valor-input" style="width:110px" inputmode="decimal" value="${state.salario ? state.salario.toFixed(2).replace('.',',') : ''}" placeholder="0,00" />
          </div>
        </div>
      </div>

      <div class="section">
        <div class="section-head">
          <h2>Contas fixas</h2>
          <span class="section-total">${formatBRL(t.totalFixas)}</span>
          <button class="add-btn" id="add-fixa" aria-label="Adicionar conta fixa">+</button>
        </div>
        <div class="list" id="list-fixas">
          ${renderList(state.fixas, 'fixas')}
        </div>
      </div>

      <div class="section">
        <div class="section-head">
          <h2>Gastos extras</h2>
          <span class="section-total">${formatBRL(t.totalExtras)}</span>
          <button class="add-btn" id="add-extra" aria-label="Adicionar gasto extra">+</button>
        </div>
        <div class="list" id="list-extras">
          ${renderList(state.extras, 'extras')}
        </div>
      </div>

      <div class="receipt">
        <div class="receipt-title">— Fechamento —</div>
        <div class="rline"><span class="lbl">Renda do mês</span><span class="dots"></span><span class="val">${formatBRL(state.salario)}</span></div>
        <div class="rline sub neg"><span class="lbl">Contas fixas</span><span class="dots"></span><span class="val">- ${formatBRL(t.totalFixas)}</span></div>
        <div class="rline sub neg"><span class="lbl">Gastos extras</span><span class="dots"></span><span class="val">- ${formatBRL(t.totalExtras)}</span></div>
        <div class="rdiv"></div>
        <div class="rline total"><span class="lbl">Saldo previsto</span><span class="dots"></span><span class="val ${t.saldoPrevisto>=0?'pos':'neg'}">${formatBRL(t.saldoPrevisto)}</span></div>
        <div class="rline sub" style="margin-top:10px;"><span class="lbl">Já pago</span><span class="dots"></span><span class="val">${formatBRL(t.totalPago)}</span></div>
        <div class="rline sub"><span class="lbl">Disponível agora</span><span class="dots"></span><span class="val">${formatBRL(t.disponivelAgora)}</span></div>
        <div class="stamp-row">
          <div class="stamp pago">pago ${formatBRL(t.totalPago)}</div>
          <div class="stamp falta">falta ${formatBRL(t.totalFalta)}</div>
        </div>
      </div>

      <div class="savehint" id="savehint">salvo ✓</div>

      <div class="footer-actions">
        <button class="close-month-btn" id="close-month-btn">Fechar mês e começar o próximo</button>
      </div>
      <div class="confirm-box" id="confirm-box">
        Isso vai desmarcar os pagamentos das contas fixas e limpar a lista de gastos extras (as contas fixas continuam, só os extras somem). O nome do mês você edita ali em cima. Confirmar?
        <div class="confirm-actions">
          <button class="btn-confirm" id="confirm-yes">Sim, fechar mês</button>
          <button class="btn-cancel" id="confirm-no">Cancelar</button>
        </div>
      </div>
    `;

    attachEvents();
  }

  function renderList(arr, kind){
    if (!arr.length){
      return `<div class="empty">Nenhuma ${kind === 'fixas' ? 'conta fixa' : 'gasto extra'} ainda.<br>Toque no + para adicionar.</div>`;
    }
    return arr.map(item => `
      <div class="item ${item.pago ? 'paid':''}" data-id="${item.id}" data-kind="${kind}">
        <button class="check ${item.pago?'on':''}" data-action="toggle">${item.pago ? '✓':''}</button>
        <input class="nome-input" data-action="nome" placeholder="Nome (ex: Aluguel)" value="${escapeAttr(item.nome)}" />
        <div class="valor-wrap">
          <span>R$</span>
          <input class="valor-input" data-action="valor" inputmode="decimal" placeholder="0,00" value="${item.valor ? Number(item.valor).toFixed(2).replace('.',',') : ''}" />
        </div>
        <button class="del-btn" data-action="del" aria-label="Remover">✕</button>
      </div>
    `).join('');
  }

  function escapeAttr(str){
    return String(str || '').replace(/"/g,'&quot;');
  }

  function findItem(kind, id){
    const arr = kind === 'fixas' ? state.fixas : state.extras;
    return arr.find(i => i.id === id);
  }

  function saveKind(kind){
    if (kind === 'fixas') saveFixas(); else saveExtras();
  }

  // ---------- events ----------
  function attachEvents(){
    document.getElementById('mes-input').addEventListener('change', (e) => {
      state.mes = e.target.value;
      saveConfig();
    });

    document.getElementById('salario-input').addEventListener('input', (e) => {
      state.salario = parseValor(e.target.value);
      saveConfig();
      refreshTotalsOnly();
    });
    document.getElementById('salario-input').addEventListener('blur', render);

    document.getElementById('add-fixa').addEventListener('click', () => addItem('fixas'));
    document.getElementById('add-extra').addEventListener('click', () => addItem('extras'));

    document.getElementById('close-month-btn').addEventListener('click', () => {
      document.getElementById('confirm-box').classList.add('show');
    });
    document.getElementById('confirm-no').addEventListener('click', () => {
      document.getElementById('confirm-box').classList.remove('show');
    });
    document.getElementById('confirm-yes').addEventListener('click', closeMonth);

    ['list-fixas','list-extras'].forEach(listId => {
      const kind = listId === 'list-fixas' ? 'fixas' : 'extras';
      const list = document.getElementById(listId);

      list.addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-action]');
        if (!btn) return;
        const row = btn.closest('.item');
        const id = row.dataset.id;
        const item = findItem(kind, id);
        if (!item) return;

        if (btn.dataset.action === 'toggle'){
          item.pago = !item.pago;
          saveKind(kind);
          render();
        } else if (btn.dataset.action === 'del'){
          const arr = kind === 'fixas' ? state.fixas : state.extras;
          const idx = arr.findIndex(i => i.id === id);
          if (idx > -1) arr.splice(idx,1);
          saveKind(kind);
          render();
        }
      });

      list.addEventListener('input', (e) => {
        const input = e.target.closest('input[data-action]');
        if (!input) return;
        const row = input.closest('.item');
        const id = row.dataset.id;
        const item = findItem(kind, id);
        if (!item) return;

        if (input.dataset.action === 'nome'){
          item.nome = input.value;
        } else if (input.dataset.action === 'valor'){
          item.valor = parseValor(input.value);
          refreshTotalsOnly();
        }
        saveKind(kind);
      });
    });
  }

  function addItem(kind){
    const arr = kind === 'fixas' ? state.fixas : state.extras;
    const item = { id: uid(), nome:'', valor:0, pago:false };
    arr.push(item);
    saveKind(kind);
    render();
    // foca no campo nome recém-criado
    requestAnimationFrame(() => {
      const row = document.querySelector(`.item[data-id="${item.id}"] .nome-input`);
      if (row) row.focus();
    });
  }

  function closeMonth(){
    state.fixas.forEach(i => i.pago = false);
    state.extras = [];
    saveFixas();
    saveExtras();
    document.getElementById('confirm-box').classList.remove('show');
    render();
  }

  // Atualiza só os números (saldo, chips, receipt) sem re-renderizar
  // os inputs de texto, pra não perder o foco/cursor enquanto digita.
  function refreshTotalsOnly(){
    const t = totals();
    const saldoEl = document.querySelector('.saldo-valor');
    if (saldoEl){
      saldoEl.textContent = formatBRL(t.saldoPrevisto);
      saldoEl.className = 'saldo-valor ' + (t.saldoPrevisto >= 0 ? 'pos':'neg');
    }
    const chips = document.querySelectorAll('.chip b');
    if (chips[0]) chips[0].textContent = formatBRL(t.totalGasto);
    if (chips[1]) chips[1].textContent = formatBRL(t.totalFalta);

    const sectionTotals = document.querySelectorAll('.section-total');
    if (sectionTotals[0]) sectionTotals[0].textContent = formatBRL(t.totalFixas);
    if (sectionTotals[1]) sectionTotals[1].textContent = formatBRL(t.totalExtras);

    const rvals = document.querySelectorAll('.receipt .val');
    if (rvals.length >= 6){
      rvals[0].textContent = formatBRL(state.salario);
      rvals[1].textContent = '- ' + formatBRL(t.totalFixas);
      rvals[2].textContent = '- ' + formatBRL(t.totalExtras);
      rvals[3].textContent = formatBRL(t.saldoPrevisto);
      rvals[3].className = 'val ' + (t.saldoPrevisto>=0?'pos':'neg');
      rvals[4].textContent = formatBRL(t.totalPago);
      rvals[5].textContent = formatBRL(t.disponivelAgora);
    }
    const stamps = document.querySelectorAll('.stamp');
    if (stamps[0]) stamps[0].textContent = 'pago ' + formatBRL(t.totalPago);
    if (stamps[1]) stamps[1].textContent = 'falta ' + formatBRL(t.totalFalta);
  }

  // ---------- init ----------
  (async function init(){
    await loadState();
    render();
  })();
})();
</script>
</body>
</html>
